[paths]
normalization = "artifacts/datasets/pull_cube_scale_v1/normalization.json"
micro_q4d_checkpoint = "artifacts/experiments/pull_cube_scale_v1/h8/micro_q4d/best.pt"
dense_checkpoint = "artifacts/experiments/pull_cube_scale_v1/h8/dense/best.pt"
no_action_checkpoint = "artifacts/experiments/pull_cube_scale_v1/h8/no_action/best.pt"
output = "artifacts/submission_v1/planning/gripper_aware_pilot_v1/pull_cube/report.json"

[model]
width = 128
horizon = 8
action_dimensions = 7
scene_points = 512
object_query_limit = 48

[simulation]
env_id = "PullCube-v1"
control_mode = "pd_ee_delta_pose"
approach_max_steps = 16
control_cycles = 12
max_depth_m = 1.5
object_quota = 48
robot_quota = 128
goal_quota = 32

[planning]
seed = 13601
episodes = 10
models = ["q4d"]
methods = ["random_shooting"]
budgets_ms = [100.0]
candidates_per_batch = 64
elite_fraction = 0.1
initial_std_xy = 0.8
initial_std_z = 0.2
minimum_std = 0.05
action_penalty = 0.0001
settling_penalty = 0.0
settling_steps = 2
action_space = "gripper_schedules"
gripper_schedules = [
  "hold_closed",
  "hold_open",
  "closed_to_open_halfway",
  "closed_to_open_final_quarter",
  "open_to_closed_halfway",
]
minimum_schedule_probability = 0.05
amp = true

[ablation]
translation_only_config = "configs/mpc_pull_cube.toml"
translation_only_results = "artifacts/planning/pull_cube_mpc_v1/report.json"
