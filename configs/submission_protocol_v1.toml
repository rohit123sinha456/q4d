[protocol]
id = "submission_v1"
frozen_on = "2026-09-01"
status = "locked_before_new_test_results"
base_commit = "298538a238342271754ce2b07f6389a5d40b7aaf"
output_root = "artifacts/submission_v1"
protocol_output = "artifacts/submission_v1/protocol_freeze"
prior_study_roots = [
  "artifacts/experiments/pushcube_scale_v1",
  "artifacts/planning/mpc_v1",
  "artifacts/planning/stop_gate_mpc",
]
amendment_rule = "Do not edit this file after any submission_v1 test result is examined. Corrections require a dated amendment, a new protocol id, and reruns of every affected condition."

[research]
question = "Across PullCube-v1, PickCube-v1, PlaceSphere-v1, and StackCube-v1, does an action-conditioned sparse queryable 4D predictor improve H=8 held-out 3D trajectory prediction over a matched no-action model, remain within frozen accuracy margins of a parameter-matched dense predictor, and convert its sparse decoding throughput into better 100 ms random-shooting oracle-object-query planning outcomes?"
primary_comparison = "micro_q4d_vs_no_action_h8_overall_ade"
primary_alternative = "micro_q4d_has_lower_task_macro_overall_ade"
allowed_claims = [
  "H=8 Micro-Q4D improves held-out trajectory prediction over the matched no-action model on the four declared tasks if the primary gate passes.",
  "Micro-Q4D is accuracy-competitive with the parameter-matched dense model only for metrics whose frozen ratio gates pass.",
  "Exact-index scene/query caching and sparse decoding improve throughput on the frozen hardware only if their confidence-interval gates pass.",
  "Gripper-aware H=8, 100 ms random-shooting MPC improves oracle-object-query planning over no-action only if a frozen planning gate passes.",
  "Action-conditioning evidence is causal only if both the paired no-action comparison and paired action-shuffle degradation pass.",
]
forbidden_claims = [
  "general-purpose manipulation planning",
  "cross-task generalization or joint multi-task learning",
  "deployable perception or non-oracle planning",
  "planner superiority outside H=8 100 ms random shooting",
  "statistical independence of points, control cycles, budgets, or planners",
  "success on tasks or metrics that fail their frozen gate",
]

[scope]
tasks = ["pull_cube", "pick_cube", "place_sphere", "stack_cube"]
environments = ["PullCube-v1", "PickCube-v1", "PlaceSphere-v1", "StackCube-v1"]
models = ["micro_q4d", "no_action", "dense"]
primary_horizon = 8
secondary_horizons = [1, 2, 4]
primary_planner = "random_shooting"
secondary_planners = ["cem"]
primary_budget_ms = 100.0
secondary_budgets_ms = [50.0, 200.0]
planning_label = "oracle-object-query planning"
translation_only_role = "preserved prior ablation"

[data]
use_existing_frozen_splits = true
use_existing_training_only_normalization = true
scene_points = 512
sparse_queries = 64
dense_queries = 512
split_files = [
  "artifacts/datasets/pull_cube_scale_v1/splits.json",
  "artifacts/datasets/pick_cube_scale_v1/splits.json",
  "artifacts/datasets/place_sphere_scale_v1/splits.json",
  "artifacts/datasets/stack_cube_scale_v1/splits.json",
]
normalization_files = [
  "artifacts/datasets/pull_cube_scale_v1/normalization.json",
  "artifacts/datasets/pick_cube_scale_v1/normalization.json",
  "artifacts/datasets/place_sphere_scale_v1/normalization.json",
  "artifacts/datasets/stack_cube_scale_v1/normalization.json",
]

[training]
independent_seeds_per_task_model = 3
pull_cube_seeds = [2701, 2702, 2703]
pick_cube_seeds = [3701, 3702, 3703]
place_sphere_seeds = [4701, 4702, 4703]
stack_cube_seeds = [5701, 5702, 5703]
epochs = 30
patience = 6
batch_size = 32
learning_rate = 0.001
weight_decay = 0.0001
gradient_clip_norm = 1.0
amp = true
model_width = 128
selection_rule = "lowest validation loss; test metrics are evaluated once after selection"

[planning]
pilot_episodes_per_task = 10
definitive_episodes_per_task_model = 30
models = ["micro_q4d", "no_action", "dense"]
candidate_seed_pairing = "identical within task, episode seed, model, and planning control"
episode_seed_pairing = "identical across models within each task"
pull_cube_pilot_seeds = [13601, 13602, 13603, 13604, 13605, 13606, 13607, 13608, 13609, 13610]
pick_cube_pilot_seeds = [14601, 14602, 14603, 14604, 14605, 14606, 14607, 14608, 14609, 14610]
place_sphere_pilot_seeds = [15601, 15602, 15603, 15604, 15605, 15606, 15607, 15608, 15609, 15610]
stack_cube_pilot_seeds = [16601, 16602, 16603, 16604, 16605, 16606, 16607, 16608, 16609, 16610]
pull_cube_definitive_seed_start = 13701
pick_cube_definitive_seed_start = 14701
place_sphere_definitive_seed_start = 15701
stack_cube_definitive_seed_start = 16701
definitive_seed_count = 30
pilot_and_definitive_seeds_disjoint = true
fixed_candidate_count_control = true

[replicates]
prediction_unit = "task x training seed"
planning_unit = "task x episode seed"
cache_unit = "independent timing trial, paired by exact query indices and inputs"
not_independent = ["points", "future steps", "control cycles", "candidate actions", "budgets", "planners"]
task_macro_weighting = "equal task weight after within-task aggregation"

[prediction_metrics]
primary = "overall ADE in world metres at H=8"
secondary = [
  "overall FDE in world metres at H=8",
  "contact ADE in world metres at H=8",
  "object ADE in world metres at H=8",
  "p95 point-time error in world metres at H=8",
  "Q4D relative ADE improvement over no-action",
  "Q4D/dense ADE ratio",
]
moving_point_threshold_m = 0.001
aggregation = "report every task and seed; then mean, sample standard deviation, 95 percent confidence interval, and equal-weight task macro"

[planning_metrics]
primary = "paired episode distance improvement difference: (initial-final task distance) for Q4D minus no-action"
secondary = [
  "success rate",
  "initial and final task distance",
  "paired per-seed distance improvement",
  "p50 and p95 planning latency",
  "budget-overrun rate and positive overrun magnitude",
  "candidates per second",
  "control cycles",
  "object-visibility failures",
  "selected gripper schedule",
  "termination reason",
]
success_source = "ManiSkill info.success after action execution"
distance_source = "task adapter task_distance_m"

[compute_metrics]
cache_speedup = "paired re-encoding latency divided by cached latency"
sparse_speedup = "paired dense decoding latency divided by sparse decoding latency"
equivalence_error_unit = "metres"
warmup_timed_separately = true
timing_trials = 5
repetitions_per_trial = 30

[statistics]
alpha = 0.05
confidence_level = 0.95
bootstrap_repetitions = 10000
bootstrap_seed = 240901
bootstrap_method = "paired hierarchical percentile bootstrap: resample tasks, then replicate seeds/trials within sampled task or configuration"
primary_test = "one-sided exact paired sign-flip randomization test on H=8 task-by-training-seed overall ADE differences, Q4D minus no-action"
planning_distance_test = "one-sided paired hierarchical bootstrap of Q4D-minus-no-action distance-improvement difference"
planning_success_test = "two-sided exact McNemar test on matched episode successes"
success_interval = "95 percent Wilson interval per task; paired hierarchical bootstrap for task-macro model differences"
multiple_comparisons = "Holm correction at familywise alpha 0.05 within each secondary family: prediction, planning, and compute; the single declared primary comparison is unadjusted"

[thresholds]
primary_q4d_vs_no_action = "mean paired H=8 overall ADE difference below zero, two-sided 95 percent paired hierarchical bootstrap upper bound below zero, and one-sided exact sign-flip p below 0.05"
action_shuffle = "Holm-adjusted 95 percent paired interval for shuffled-minus-unshuffled overall ADE is entirely above zero"
q4d_dense_overall_ade_ratio_max = 1.25
q4d_dense_contact_ade_ratio_max = 1.10
q4d_dense_object_ade_ratio_max = 1.10
dense_ratio_gate = "upper bound of the 95 percent hierarchical bootstrap confidence interval must not exceed the corresponding ratio maximum"
cache_equivalence_tolerance_m = 0.0005
cache_speedup = "lower bound of the paired 95 percent confidence interval is greater than 1.0"
sparse_speedup = "lower bound of the paired 95 percent confidence interval is greater than 1.0"
pilot_minimum_successes_per_task = 1
definitive_nontrivial_success_rate_min = 0.10
planning_distance = "lower bound of the paired 95 percent hierarchical bootstrap interval for Q4D-minus-no-action distance improvement is above zero"
planning_success = "Holm-adjusted exact McNemar p below 0.05 and Q4D success rate exceeds no-action"
planning_positive_gate = "planning_distance OR planning_success, with the successful branch named explicitly"
planning_dense_success_noninferiority_margin = 0.10
planning_dense_final_distance_margin_m = 0.01
planning_dense_comparability = "Q4D success minus dense success lower confidence bound is at least -0.10 and Q4D-minus-dense final-distance upper confidence bound is at most 0.01 m"
higher_throughput = "Q4D/dense candidates-per-second lower 95 percent confidence bound is greater than 1.0"

[exclusions]
post_hoc_exclusions_allowed = false
prediction = "No valid frozen test group, task, seed, or model run is excluded. A missing or non-finite required metric fails the affected gate."
planning = "No started episode is excluded. Object-not-visible, invalid action, simulator error after the first action, control-cycle-limit, and timeout outcomes remain recorded failures."
compute = "No completed timing trial is excluded. Warm-up is separated before timing; interrupted trials are logged and rerun in full with the same inputs."

[failure_handling]
infrastructure_before_measurement = "Log the incident and rerun the same condition and seed from scratch; retain both logs."
training_after_measurement_starts = "Retain the run. OOM, NaN, missing checkpoint, or missing metric fails that seed and the affected positive gate; do not replace it with a new seed."
planning_after_first_action = "Save the partial episode immediately, classify it as unsuccessful with its explicit termination reason, and do not rerun it as a replacement."
invalid_action = "Fail the planner implementation gate; do not use affected planning results for a positive claim."
object_not_visible = "Count as unsuccessful and retain the last valid task distance and all preceding cycles."
budget_overrun = "Retain the cycle and include it in overrun rate and magnitude; never exclude it from latency."
zero_success_task = "Report without exclusion; the positive multi-task planning claim fails for that task."

[environment]
timing_hardware_frozen = true
os = "Ubuntu 24.04.4 LTS under WSL2 kernel 6.6.87.2"
python = "3.12.3"
gpu = "NVIDIA GeForce RTX 4060 Laptop GPU, 8188 MiB"
nvidia_driver = "592.82"
pytorch = "2.11.0+cu128"
pytorch_cuda_runtime = "12.8"
maniskill = "3.0.1"
sapien = "3.0.3"
package_lock = "requirements/lock-wsl-cu128.txt"
hardware_change_rule = "Do not pool raw latency across hardware. Create a new protocol version and report hardware-stratified timing if hardware changes."
