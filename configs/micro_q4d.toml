[paths]
data_config = "configs/data.toml"
split_manifest = "artifacts/datasets/pushcube_counterfactual_v1/splits.json"
normalization = "artifacts/datasets/pushcube_counterfactual_v1/normalization.json"
reference_baselines = "artifacts/evaluation/counterfactual_non_neural_baselines.json"
no_action_report = "artifacts/models/no_action_v1/report.json"
output_dir = "artifacts/models/micro_q4d_v1"

[model]
width = 128
horizon = 8
action_dimensions = 7

[training]
seed = 7
epochs = 160
patience = 30
micro_batch_size = 8
gradient_accumulation_steps = 1
num_workers = 2
learning_rate = 0.001
weight_decay = 0.0001
gradient_clip_norm = 1.0
amp = true
queries = 32
memory_budget_mib = 6144
minimum_headroom_mib = 1024

[evaluation]
batch_size = 2
queries = 256
moving_threshold_m = 0.001
candidate_branches = 64
benchmark_repetitions = 30
